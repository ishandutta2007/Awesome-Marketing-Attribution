<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="45%" stop-color="#0c1728" />
      <stop offset="100%" stop-color="#162238" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Header Gradient text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (SMIL NATIVE FOR GITHUB CAMO / MARKDOWN) -->
  <g opacity="0.45">
    <!-- Animated Flow Journey 1 -->
    <path d="M 60,290 C 260,320 400,240 600,270 C 800,300 960,230 1140,280" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="10 8">
      <animate attributeName="stroke-dashoffset" from="180" to="0" dur="10s" repeatCount="indefinite" />
    </path>

    <!-- Animated Flow Journey 2 -->
    <path d="M 60,80 C 260,30 460,110 680,60 C 880,20 1020,95 1140,55" 
          fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="0" to="140" dur="12s" repeatCount="indefinite" />
    </path>

    <!-- Dynamic Pulsing Touchpoint Nodes (Safe SMIL attribute animations) -->
    <!-- Node 1 -->
    <circle cx="210" cy="85" r="8" fill="#38bdf8">
      <animate attributeName="r" values="6;11;6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Node 2 -->
    <circle cx="680" cy="60" r="10" fill="#818cf8">
      <animate attributeName="r" values="8;13;8" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.95;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <!-- Node 3 -->
    <circle cx="1040" cy="88" r="9" fill="#c084fc">
      <animate attributeName="r" values="6;12;6" dur="3.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.85;0.3" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <!-- Node 4 -->
    <circle cx="980" cy="255" r="11" fill="#38bdf8">
      <animate attributeName="r" values="8;14;8" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.35;0.9;0.35" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <!-- Node 5 -->
    <circle cx="360" cy="275" r="8" fill="#818cf8">
      <animate attributeName="r" values="6;11;6" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(80, 50)">
    <rect width="210" height="28" rx="14" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="15" cy="14" r="4.5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="11.5" letter-spacing="1.5">CURATED ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title & Subtitle (Clean, Unobstructed Foreground) -->
  <g transform="translate(80, 138)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">Awesome Marketing Attribution</text>
    <text x="0" y="38" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="18.5">Multi-Touch Attribution (MTA) • Marketing Mix Modeling (MMM) • Mobile Measurement (MMP)</text>
  </g>

  <!-- FOREGROUND FEATURE PILLS -->
  <g transform="translate(80, 246)">
    <!-- Subtle float animation using SMIL -->
    <animateTransform attributeName="transform" type="translate" values="80,248; 80,242; 80,248" dur="5s" repeatCount="indefinite" />

    <!-- Pill 1: Shapley & Markov -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13">Shapley &amp; Markov Models</text>
    </g>

    <!-- Pill 2: Open Source MMP -->
    <g transform="translate(225, 0)">
      <rect width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#818cf8" />
      <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13">Open-Source MMP</text>
    </g>

    <!-- Pill 3: Causal MMM -->
    <g transform="translate(420, 0)">
      <rect width="200" height="42" rx="21" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#a855f7" />
      <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13">Bayesian Causal MMM</text>
    </g>

    <!-- Pill 4: Enterprise SaaS -->
    <g transform="translate(635, 0)">
      <rect width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#ec4899" />
      <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13">Enterprise SaaS Stack</text>
    </g>

    <!-- Pill 5: Real-time Analytics -->
    <g transform="translate(835, 0)">
      <rect width="185" height="42" rx="21" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" />
      <circle cx="22" cy="21" r="5" fill="#10b981" />
      <text x="36" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="13">Cross-Channel ROI</text>
    </g>
  </g>
</svg>
