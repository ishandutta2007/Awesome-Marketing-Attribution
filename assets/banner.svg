<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #38bdf8;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      
      /* Subtle dynamic background flow & node pulses */
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .node-anim {
        animation: pulseNode 4s ease-in-out infinite;
      }
      .flow-path {
        stroke-dasharray: 8 6;
        animation: dashFlow 15s linear infinite;
      }
      .floating-group {
        animation: floatSlow 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Z-INDEX BELOW FOREGROUND TEXT) -->
  <g opacity="0.35">
    <!-- Journey Flow Lines -->
    <path class="flow-path" d="M 100,300 C 300,320 400,240 600,280 C 800,320 950,230 1120,290" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flow-path" d="M 80,80 C 260,30 440,110 650,60 C 850,20 1000,100 1140,50" fill="none" stroke="#818cf8" stroke-width="2" style="animation-direction: reverse; animation-duration: 18s;" />
    
    <!-- Attribution Funnel Curves -->
    <path class="flow-path" d="M 700,340 C 820,280 940,290 1080,210" fill="none" stroke="#c084fc" stroke-width="2" />
    
    <!-- Background Animated Nodes -->
    <circle cx="200" cy="90" r="14" fill="#38bdf8" opacity="0.4" class="node-anim" filter="url(#glow)" />
    <circle cx="650" cy="60" r="18" fill="#818cf8" opacity="0.3" class="node-anim" style="animation-delay: 1.5s;" filter="url(#glow)" />
    <circle cx="1020" cy="80" r="16" fill="#c084fc" opacity="0.4" class="node-anim" style="animation-delay: 3s;" filter="url(#glow)" />
    <circle cx="950" cy="270" r="20" fill="#38bdf8" opacity="0.3" class="node-anim" style="animation-delay: 2s;" filter="url(#glow)" />
    <circle cx="350" cy="290" r="12" fill="#818cf8" opacity="0.4" class="node-anim" style="animation-delay: 0.8s;" filter="url(#glow)" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(80, 56)">
    <rect width="210" height="30" rx="15" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
    <text x="30" y="19" class="badge-text">CURATED ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title & Subtitle (Always Clear and Unobstructed) -->
  <g transform="translate(80, 142)">
    <text x="0" y="0" class="title-text">Awesome Marketing Attribution</text>
    <text x="0" y="40" class="subtitle-text">Multi-Touch Attribution (MTA) • Marketing Mix Modeling (MMM) • Mobile Measurement (MMP)</text>
  </g>

  <!-- FOREGROUND FEATURE PILLS -->
  <g class="floating-group" transform="translate(80, 246)">
    <!-- Pill 1: Shapley & Markov -->
    <g transform="translate(0, 0)">
      <rect width="210" height="44" rx="22" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="24" cy="22" r="5" fill="#38bdf8" />
      <text x="40" y="27" class="pill-text">Shapley &amp; Markov Models</text>
    </g>

    <!-- Pill 2: Open Source MMP -->
    <g transform="translate(225, 0)">
      <rect width="180" height="44" rx="22" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="24" cy="22" r="5" fill="#818cf8" />
      <text x="40" y="27" class="pill-text">Open-Source MMP</text>
    </g>

    <!-- Pill 3: Causal MMM -->
    <g transform="translate(420, 0)">
      <rect width="195" height="44" rx="22" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="24" cy="22" r="5" fill="#a855f7" />
      <text x="40" y="27" class="pill-text">Bayesian Causal MMM</text>
    </g>

    <!-- Pill 4: Enterprise SaaS -->
    <g transform="translate(630, 0)">
      <rect width="185" height="44" rx="22" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="24" cy="22" r="5" fill="#ec4899" />
      <text x="40" y="27" class="pill-text">Enterprise SaaS Stack</text>
    </g>

    <!-- Pill 5: Real-time Analytics -->
    <g transform="translate(830, 0)">
      <rect width="190" height="44" rx="22" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.6" stroke-width="1.2" />
      <circle cx="24" cy="22" r="5" fill="#10b981" />
      <text x="40" y="27" class="pill-text">Cross-Channel ROI</text>
    </g>
  </g>
</svg>
